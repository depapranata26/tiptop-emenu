*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f5f1e8;color:#241a10;-webkit-tap-highlight-color:transparent}
/* ===== HERO modern ===== */
.hero{background:radial-gradient(130% 150% at 50% 0%,#53300f 0%,#2b1a08 58%,#1a0f04 100%);color:#f5ead0;padding:34px 18px 30px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(55% 45% at 50% 100%,rgba(201,162,75,.16),transparent 70%);pointer-events:none}
.eyebrow{display:inline-block;position:relative;z-index:1;letter-spacing:4px;font-size:10.5px;font-weight:800;color:#241a08;background:linear-gradient(135deg,#f0d189,#c9a24b);text-transform:uppercase;padding:6px 16px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.hero h1{position:relative;z-index:1;font-size:33px;margin:14px 0 5px;color:#faf3df;font-weight:800;letter-spacing:.5px}
.hero .sub{position:relative;z-index:1;color:#d9c69a;font-size:13.5px}
.hero .rule{display:none}
.langs{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap;position:relative;z-index:1}
.langs button{border:1px solid rgba(232,201,122,.45);background:rgba(255,255,255,.07);color:#e8c97a;font-size:12px;font-weight:700;letter-spacing:1px;padding:8px 18px;border-radius:999px;cursor:pointer;backdrop-filter:blur(4px);transition:all .15s}
.langs button.active{background:linear-gradient(135deg,#f0d189,#c9a24b);border-color:transparent;color:#2b1a08;box-shadow:0 2px 10px rgba(201,162,75,.4)}
/* ===== TOOLBAR ===== */
.toolbar{position:sticky;top:0;z-index:30;background:rgba(245,241,232,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #e9dfc9;padding:12px 12px 10px}
.search{max-width:560px;margin:0 auto 10px;position:relative}
.search input{width:100%;padding:13px 16px 13px 44px;border:none;border-radius:16px;font-size:15px;background:#fff;color:#241a10;outline:none;box-shadow:0 2px 14px rgba(60,35,10,.10)}
.search input:focus{box-shadow:0 2px 14px rgba(60,35,10,.12),0 0 0 2px #c9a24b}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:#a89a83;fill:none;stroke-width:2}
.tabs{display:flex;gap:8px;overflow-x:auto;max-width:900px;margin:0 auto;padding:2px 2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:none;background:#fff;color:#6b5a41;font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 6px rgba(60,35,10,.08);transition:all .15s}
.tab small{font-weight:700;color:#a89a83;margin-left:6px;background:#f3ecdc;padding:2px 8px;border-radius:999px;font-size:11px}
.tab.active{background:#2b1a08;color:#f5ead0;box-shadow:0 4px 14px rgba(43,26,8,.28)}
.tab.active small{background:rgba(201,162,75,.28);color:#f0d189}
/* ===== GRID & KARTU ===== */
main{max-width:1100px;margin:0 auto;padding:16px 14px 48px}
.count{font-size:12.5px;color:#9a8a70;margin:2px 2px 12px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 14px rgba(60,35,10,.09);display:flex;flex-direction:column;transition:transform .18s ease,box-shadow .18s ease;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(60,35,10,.15)}
.card:active{transform:scale(.98)}
.im{aspect-ratio:4/3;background:linear-gradient(140deg,#e9dcc2,#d9c8a4);position:relative;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.card:hover .im img{transform:scale(1.04)}
.pbadge{position:absolute;right:10px;bottom:10px;background:rgba(28,17,4,.85);backdrop-filter:blur(6px);color:#f5d67b;font-weight:800;font-size:13.5px;padding:7px 13px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.3);letter-spacing:.2px}
.pbadge.na{background:rgba(130,118,100,.9);color:#fff;font-weight:600;font-style:italic}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#3a2210,#5a3a1c)}
.ph span{font-size:54px;color:#c9a24b;opacity:.9;font-weight:800}
.bd{padding:11px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.bd h3{font-size:14.5px;line-height:1.35;font-weight:650;color:#2b2118}
.cat{font-size:10.5px;color:#c9a24b;text-transform:uppercase;letter-spacing:1.4px;font-weight:800}
.empty{text-align:center;color:#8a7a64;padding:56px 20px;font-size:15px;grid-column:1/-1;background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(60,35,10,.06)}
/* ===== FOOTER ===== */
footer{background:linear-gradient(180deg,#241505,#180d02);color:#d8c49a;text-align:center;padding:36px 18px;font-size:13.5px}
footer .fname{font-size:19px;color:#f0dfb8;margin-bottom:6px;font-weight:700}
footer .credit{margin-top:14px;font-size:12px;color:#8a744f;letter-spacing:.5px}
/* ===== TOMBOL & MODAL ===== */
#top{position:fixed;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;border:none;background:#2b1a08;color:#f0dfb8;font-size:20px;cursor:pointer;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:40}
#top.show{display:block}
.modal-ov{position:fixed;inset:0;background:rgba(24,14,4,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal-ov.open{display:flex}
.modal{background:#fffdf8;border-radius:22px;max-width:430px;width:100%;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:pop .2s ease;max-height:92vh;overflow-y:auto}
@keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-wrap{position:relative}
.modal .im{aspect-ratio:16/10;border-radius:0}
.modal .bd{padding:18px 22px 24px}
.modal .cat{font-size:11px;color:#c9a24b;text-transform:uppercase;letter-spacing:1.4px;font-weight:800}
.modal h3{font-size:20px;line-height:1.35;font-weight:750;margin:6px 0 10px;color:#2b2118}
.modal .price{display:inline-block;background:linear-gradient(135deg,#f0d189,#c9a24b);color:#2b1a08;font-weight:800;font-size:17px;padding:8px 18px;border-radius:999px}
.modal .na{color:#b3a48c;font-style:italic;font-weight:500;font-size:15px}
.modal-x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(28,17,4,.6);backdrop-filter:blur(4px);color:#f3e7cd;font-size:21px;line-height:1;cursor:pointer}
/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .55s ease}
.splash.show{opacity:1;pointer-events:auto}
.splash .bg{position:absolute;inset:0;display:flex}
.splash .half{flex:1;position:relative;overflow:hidden}
.splash .half img{width:100%;height:100%;object-fit:cover;display:block;animation:slowzoom 9s ease-in-out infinite alternate}
@keyframes slowzoom{from{transform:scale(1.06)}to{transform:scale(1.16)}}
.splash .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,24,7,.62) 0%,rgba(40,24,7,.38) 45%,rgba(40,24,7,.88) 100%)}
.splash .inner{position:relative;text-align:center;color:#f7ecd4;padding:24px;max-width:440px;transform:translateY(26px);opacity:0;transition:transform .65s ease .2s,opacity .65s ease .2s}
.splash.show .inner{transform:none;opacity:1}
.s-eyebrow{display:inline-block;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:800;color:#241a08;background:linear-gradient(135deg,#f0d189,#c9a24b);padding:7px 18px;border-radius:999px;margin-bottom:14px}
.splash h1{font-size:46px;line-height:1.1;margin:0 0 8px;font-weight:800;text-shadow:0 2px 18px rgba(0,0,0,.45);letter-spacing:.5px}
.s-by{font-size:15px;font-style:italic;color:#efe0bd;margin-bottom:28px}
.s-btn{background:linear-gradient(135deg,#f0d189,#c9971f);border:none;color:#2b1a08;font-weight:800;font-size:16px;padding:14px 42px;border-radius:999px;cursor:pointer;box-shadow:0 8px 26px rgba(0,0,0,.4);transition:transform .15s}
.s-btn:active{transform:scale(.96)}
.s-hint{margin-top:16px;font-size:12px;color:#d9c69a}
@media(max-width:560px){.splash .bg{flex-direction:column}.splash h1{font-size:38px}.hero h1{font-size:28px}}
</style>
</head>

const grid = document.getElementById('grid');
const tabsEl = document.getElementById('tabs');
const countEl = document.getElementById('count');
const qEl = document.getElementById('q');
const langsEl = document.getElementById('langs');
const heroSub = document.getElementById('heroSub');
const eyebrowEl = document.getElementById('eyebrow');
const footLoc = document.getElementById('footLoc');
const footCredit = document.getElementById('footCredit');
const topBtn = document.getElementById('top');
const metaDesc = document.querySelector('meta[name="description"]');
const modalOv = document.getElementById('modalOv');
const mImg = document.getElementById('mImg');
const mCat = document.getElementById('mCat');
const mName = document.getElementById('mName');
const mPrice = document.getElementById('mPrice');
const modalX = document.getElementById('modalX');
const splash = document.getElementById('splash');
const splashTitle = document.getElementById('splashTitle');
const splashBtn = document.getElementById('splashBtn');
const splashHint = document.getElementById('splashHint');
let activeCat = 'all';

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function imgFallback(el){
  const d = document.createElement('div');
  d.className = 'ph';
  d.innerHTML = '<span>T</span>';
  el.replaceWith(d);
}
window.imgFallback = imgFallback;

function counts(){
  const cats = S().cats;
  const c = {all: MENU.length};
  for(const k of Object.keys(cats)) if(k!=='all') c[k] = 0;
  for(const m of MENU) c[m[3]]++;
  return c;
}
function renderTabs(){
  const cats = S().cats, c = counts();
  tabsEl.innerHTML = Object.keys(cats).map(k =>
    `<button class="tab${k===activeCat?' active':''}" data-cat="${k}">${cats[k]}<small>${c[k]}</small></button>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    activeCat = b.dataset.cat;
    renderTabs(); render();
  }));
}
function renderLangs(){
  const s = S();
  langsEl.setAttribute('aria-label', s.langLabel);
  langsEl.innerHTML = LANGS.map(l =>
    `<button class="${l===lang?'active':''}" data-lang="${l}">${LANG_LABEL[l]}</button>`
  ).join('');
  langsEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
}
function setLang(l){
  if(LANGS.indexOf(l) < 0 || l === lang) return;
  lang = l;
  try{ localStorage.setItem('tiptop-lang', l); }catch(e){}
  applyLang();
}
function applyLang(){
  const s = S();
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.title = s.title;
  if(metaDesc) metaDesc.setAttribute('content', s.desc);
  qEl.placeholder = s.search;
  qEl.setAttribute('aria-label', s.search);
  eyebrowEl.textContent = s.eyebrow;
  heroSub.textContent = s.sub;
  footLoc.textContent = s.foot;
  footCredit.textContent = s.credit;
  splashTitle.textContent = s.splashTitle;
  splashBtn.textContent = s.splashBtn;
  splashHint.textContent = s.tapHint;
  topBtn.setAttribute('aria-label', s.top);
  renderLangs(); renderTabs(); render();
}
function openModal(m){
  const s = S(), name = tname(m[0]);
  mCat.textContent = s.cats[m[3]];
  mName.textContent = name;
  mPrice.innerHTML = m[1] === '-'
    ? `<div class="na">${s.na}</div>`
    : `<div class="price">${esc(m[1])}</div>`;
  mImg.innerHTML = m[2]
    ? `<img src="${IMG_BASE}${m[2]}" alt="${esc(name)}" onerror="imgFallback(this)">`
    : `<div class="ph"><span>T</span></div>`;
  modalX.setAttribute('aria-label', s.close);
  modalOv.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  modalOv.classList.remove('open');
  document.body.style.overflow = '';
}
let splashClosed = false;
function closeSplash(){
  if(splashClosed) return;
  splashClosed = true;
  splash.classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(() => { splash.style.display = 'none'; }, 600);
}
function render(){
  const s = S(), cats = s.cats;
  const q = qEl.value.trim().toLowerCase();
  const items = MENU.filter(m => {
    const nm = tname(m[0]).toLowerCase();
    return (activeCat==='all' || m[3]===activeCat) &&
      (!q || m[0].toLowerCase().includes(q) || nm.includes(q));
  });
  countEl.textContent = s.showing(items.length, MENU.length);
  if(!items.length){
    grid.innerHTML = `<div class="empty">${s.empty}</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  const tmp = document.createElement('div');
  for(const m of items){
    const name = tname(m[0]), price = m[1], img = m[2], cat = m[3];
    const media = img
      ? `<img src="${IMG_BASE}${img}" alt="${esc(name)}" loading="lazy" decoding="async" onerror="imgFallback(this)">`
      : `<div class="ph"><span>T</span></div>`;
    const priceHtml = price === '-'
      ? `<span class="pbadge na">${s.na}</span>`
      : `<span class="pbadge">${esc(price)}</span>`;
    tmp.innerHTML = `<article class="card"><div class="im">${media}${priceHtml}</div><div class="bd"><div class="cat">${cats[cat]}</div><h3>${esc(name)}</h3></div></article>`;
    const art = tmp.firstChild;
    art.style.cursor = 'pointer';
    art.setAttribute('role', 'button');
    art.setAttribute('tabindex', '0');
    art.addEventListener('click', () => openModal(m));
    art.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(m); }
    });
    frag.appendChild(art);
  }
  grid.innerHTML = '';
  grid.appendChild(frag);
}
qEl.addEventListener('input', render);
applyLang();

window.addEventListener('scroll', () => topBtn.classList.toggle('show', window.scrollY > 600), {passive:true});
topBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
modalX.addEventListener('click', closeModal);
modalOv.addEventListener('click', e => { if(e.target === modalOv) closeModal(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && modalOv.classList.contains('open')) closeModal();
  if(e.key === 'Escape' && splash.classList.contains('show')) closeSplash();
});
splashBtn.addEventListener('click', e => { e.stopPropagation(); closeSplash(); });
splash.addEventListener('click', closeSplash);
document.body.style.overflow = 'hidden';
setTimeout(() => splash.classList.add('show'), 80);
</script>
